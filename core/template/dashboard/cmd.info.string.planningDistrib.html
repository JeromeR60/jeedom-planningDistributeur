<div class="cmd cmd-widget planningDistrib" data-type="info" data-subtype="string" data-template="planningDistrib" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" style="display:block;width:360px;max-width:100%;box-sizing:border-box;">
  <style>
    .planningDistrib{padding:6px 8px;text-align:left;box-sizing:border-box;user-select:none;-webkit-user-select:none}
    .planningDistrib .pd-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
    .planningDistrib .pd-status{font-size:12px;opacity:.8;line-height:1.4}
    .planningDistrib .pd-today{text-align:right;white-space:nowrap}
    .planningDistrib .pd-total{font-size:22px;font-weight:500;line-height:1}
    .planningDistrib .pd-total-lbl{font-size:10px;opacity:.6}
    .planningDistrib .pd-days{display:grid;grid-template-columns:repeat(7,minmax(26px,1fr));gap:3px;margin-bottom:8px}
    .planningDistrib .pd-day{border:1px solid rgba(128,128,128,.4);border-radius:5px;padding:4px 0;text-align:center;font-size:12px;cursor:pointer}
    .planningDistrib .pd-day.on{background:rgba(128,128,128,.35);font-weight:600}
    .planningDistrib .pd-day.today{text-decoration:underline}
    .planningDistrib .pd-row{display:grid;grid-template-columns:28px repeat(6,minmax(30px,1fr));gap:2px;margin-bottom:2px;touch-action:none}
    .planningDistrib.locked .pd-row{touch-action:pan-x pan-y}
    .planningDistrib.locked .pd-cell{cursor:default}
    .planningDistrib .pd-right{display:flex;align-items:flex-start;gap:6px}
    .planningDistrib .pd-lock{display:none;align-items:center;justify-content:center;width:30px;height:30px;margin:-5px -5px 0 0;border-radius:5px;font-size:15px;cursor:pointer;opacity:.6}
    .planningDistrib .pd-lock.touch{display:inline-flex}
    .planningDistrib:not(.locked) .pd-lock{opacity:1;color:#e67e22;background:rgba(230,126,34,.18)}
    .planningDistrib.locked [data-act=copyWeek],.planningDistrib.locked [data-act=copyAll],.planningDistrib.locked [data-act=clear]{opacity:.45}
    .planningDistrib .pd-lbl{font-size:10px;opacity:.6;align-self:center}
    .planningDistrib .pd-cell{height:28px;min-width:0;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(128,128,128,.3)}
    .planningDistrib .pd-cell.now{outline:2px solid currentColor;outline-offset:-2px}
    .planningDistrib .pd-doses{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
    .planningDistrib .pd-dose{border:1px solid rgba(128,128,128,.4);border-radius:5px;padding:3px 0;text-align:center;font-size:12px;cursor:pointer}
    .planningDistrib .pd-dose.on{border:2px solid currentColor;padding:2px 0;font-weight:600}
    .planningDistrib .pd-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:8px}
    .planningDistrib .pd-actions a{margin:0!important;width:100%;font-size:11px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .planningDistrib .pd-msg{font-size:11px;min-height:14px;margin-top:4px;opacity:.8}
  </style>
  <div class="pd-head">
    <div>
      <div class="cmdName" style="font-weight:500">#name_display#</div>
      <div class="pd-status pd-next"></div>
      <div class="pd-status pd-last"></div>
    </div>
    <div class="pd-right">
      <div class="pd-today">
        <div class="pd-total"></div>
        <div class="pd-total-lbl">aujourd'hui</div>
      </div>
      <a class="pd-lock"></a>
    </div>
  </div>
  <div class="pd-days"></div>
  <div class="pd-grid"></div>
  <div class="pd-doses"></div>
  <div class="pd-actions">
    <a class="btn btn-xs btn-default" data-act="copyWeek" title="Copier ce jour du lundi au vendredi">Lun→ven</a>
    <a class="btn btn-xs btn-default" data-act="copyAll" title="Copier ce jour sur toute la semaine">7 jours</a>
    <a class="btn btn-xs btn-default" data-act="clear" title="Mettre toutes les heures de ce jour à 0">Vider le jour</a>
  </div>
  <div class="pd-msg"></div>
  <script>
  (function () {
    var root = document.querySelector('.cmd[data-cmd_uid="#uid#"]');
    if (!root) return;

    var SLOTS = 24, DAYS = 7, LEN = SLOTS * DAYS;
    var DAY_LBL = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    var DAY_NAME = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

    function param(v, def) { return (!v || v.charAt(0) === '#') ? def : v; }
    var setId = param('#set_id#', '');
    var doneId = param('#done_id#', '');
    var lastDoseId = param('#last_dose_id#', '');
    var lastTimeId = param('#last_time_id#', '');
    var MIN = Math.max(1, parseInt(param('#min#', '1'), 10) || 1);
    var MAX = Math.max(MIN, parseInt(param('#max#', '12'), 10) || 12);
    var COLOR = '#' + param('#color#', 'EF9F27');
    var width = parseInt(param('#width#', '360'), 10) || 360;
    root.style.width = width + 'px';

    var plan = [], day = todayIdx(), dose = MIN;
    var done = 0, lastDose = '', lastTime = '';
    var painting = false, dirty = false, saveTimer = null;

    var $ = function (s) { return root.querySelector(s); };
    var elDays = $('.pd-days'), elGrid = $('.pd-grid'), elDoses = $('.pd-doses');
    var elNext = $('.pd-next'), elLast = $('.pd-last'), elTotal = $('.pd-total'), elMsg = $('.pd-msg');

    function todayIdx() { return (new Date().getDay() + 6) % 7; }
    function nowIdx() { return todayIdx() * SLOTS + new Date().getHours(); }
    function hh(slot) { return String(slot % SLOTS).padStart(2, '0') + ':00'; }
    function clamp(v) { v = parseInt(v, 10) || 0; return v <= 0 ? 0 : Math.max(MIN, Math.min(v, MAX)); }

    function rgba(alpha) {
      var n = parseInt(COLOR.slice(1), 16);
      return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + alpha + ')';
    }
    function cellStyle(cell, v) {
      if (v <= 0) { cell.style.background = 'transparent'; cell.style.color = ''; cell.textContent = ''; return; }
      var a = MAX > MIN ? 0.35 + 0.65 * (v - MIN) / (MAX - MIN) : 1;
      cell.style.background = rgba(a.toFixed(2));
      cell.style.color = a > 0.55 ? '#1a1a1a' : '';
      cell.textContent = v;
    }

    function load(raw) {
      var parts = String(raw || '').split(',');
      plan = [];
      for (var i = 0; i < LEN; i++) plan.push(parts.length === LEN ? clamp(parts[i]) : 0);
    }
    function serialize() { return plan.join(','); }

    function msg(t) {
      elMsg.textContent = t;
      clearTimeout(msg.t);
      msg.t = setTimeout(function () { elMsg.textContent = ''; }, 4000);
    }

    function save() {
      clearTimeout(saveTimer);
      if (!setId) { msg('Paramètre set_id manquant : impossible d’enregistrer'); return; }
      jeedom.cmd.execute({
        id: setId,
        value: { message: serialize() },
        success: function () { dirty = false; msg('Planning enregistré'); },
        error: function (e) {
          // On relâche le verrou et on resynchronise avec la valeur enregistrée côté Jeedom
          dirty = false;
          msg('Erreur d’enregistrement : ' + (e && e.message ? e.message : ''));
          reloadFromServer();
        }
      });
    }
    function saveSoon() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200); }
    function reloadFromServer() {
      jeedom.cmd.execute({
        id: '#id#',
        success: function (v) { if (!dirty && !painting) { load(v); renderGrid(); renderStatus(); } },
        error: function () {}
      });
    }

    function renderDays() {
      elDays.innerHTML = '';
      DAY_LBL.forEach(function (l, i) {
        var e = document.createElement('div');
        e.className = 'pd-day' + (i === day ? ' on' : '') + (i === todayIdx() ? ' today' : '');
        e.textContent = l;
        e.title = DAY_NAME[i];
        e.addEventListener('click', function () { day = i; renderDays(); renderGrid(); });
        elDays.appendChild(e);
      });
    }

    function renderDoses() {
      elDoses.innerHTML = '';
      var values = [0];
      for (var v = MIN; v <= MAX; v++) values.push(v);
      values.forEach(function (v) {
        var e = document.createElement('div');
        e.className = 'pd-dose' + (v === dose ? ' on' : '');
        e.textContent = v;
        e.title = v === 0 ? 'Aucune distribution' : 'Dose ' + v;
        e.addEventListener('click', function () { dose = v; renderDoses(); });
        elDoses.appendChild(e);
      });
    }

    function renderGrid() {
      elGrid.innerHTML = '';
      var cur = nowIdx();
      for (var r = 0; r < 4; r++) {
        var row = document.createElement('div');
        row.className = 'pd-row';
        var lbl = document.createElement('div');
        lbl.className = 'pd-lbl';
        lbl.textContent = String(r * 6).padStart(2, '0') + 'h';
        row.appendChild(lbl);
        for (var c = 0; c < 6; c++) {
          var s = r * 6 + c, i = day * SLOTS + s;
          var cell = document.createElement('div');
          cell.className = 'pd-cell' + (i === cur ? ' now' : '');
          cell.dataset.i = i;
          cellStyle(cell, plan[i]);
          cell.title = hh(s) + ' : ' + (plan[i] > 0 ? 'dose ' + plan[i] : 'rien');
          row.appendChild(cell);
        }
        elGrid.appendChild(row);
      }
    }

    function nextDistrib() {
      var cur = nowIdx();
      for (var n = 1; n <= LEN; n++) {
        var j = (cur + n) % LEN;
        if (plan[j] > 0) return j;
      }
      return -1;
    }

    function renderStatus() {
      var t = todayIdx(), planned = 0;
      for (var s = 0; s < SLOTS; s++) planned += plan[t * SLOTS + s];
      elTotal.textContent = done + ' / ' + planned;
      var nx = nextDistrib();
      if (nx < 0) {
        elNext.textContent = 'Aucune distribution prévue';
      } else {
        var sameDay = Math.floor(nx / SLOTS) === t;
        elNext.textContent = 'Prochaine : ' + (sameDay ? '' : DAY_NAME[Math.floor(nx / SLOTS)] + ' ') + hh(nx) + ' – dose ' + plan[nx];
      }
      elLast.textContent = lastTime ? 'Dernière : ' + lastTime + ' – dose ' + lastDose : '';
    }

    function readInfo(id, cb) {
      if (!id) return;
      jeedom.cmd.execute({ id: id, success: cb, error: function () {} });
    }
    function refreshInfos() {
      readInfo(doneId, function (v) { done = parseInt(v, 10) || 0; renderStatus(); });
      readInfo(lastDoseId, function (v) { lastDose = v; renderStatus(); });
      readInfo(lastTimeId, function (v) { lastTime = v; renderStatus(); });
    }
    function watch(id, cb) {
      if (id && typeof jeedom.cmd.addUpdateFunction === 'function') {
        jeedom.cmd.addUpdateFunction(id, function (o) { cb(o.display_value !== undefined ? o.display_value : o.value); renderStatus(); });
      }
    }

    // Verrou d'édition : sur écran tactile, la grille est verrouillée par défaut
    // pour que le défilement de la page ne modifie pas le planning par accident.
    var TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    var LOCK_DELAY = 30000, locked = false, lockTimer = null;
    var elLock = $('.pd-lock');
    function setLocked(v) {
      locked = v;
      clearTimeout(lockTimer);
      root.classList.toggle('locked', v);
      elLock.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
        '<rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/>' +
        (v ? '<path d="M8 11V7a4 4 0 0 1 8 0v4"/>' : '<path d="M8 11V7a4 4 0 0 1 7.8-1.2"/>') + '</svg>';
      elLock.title = v ? 'Déverrouiller pour modifier le planning' : 'Verrouiller le planning';
      if (!v) armLock();
    }
    function armLock() {
      if (!TOUCH) return;
      clearTimeout(lockTimer);
      lockTimer = setTimeout(function () { if (painting) armLock(); else setLocked(true); }, LOCK_DELAY);
    }
    function lockedMsg() { msg('Planning verrouillé : touchez le cadenas pour le modifier'); }
    if (TOUCH) {
      elLock.classList.add('touch');
      elLock.addEventListener('click', function (e) {
        e.preventDefault();
        setLocked(!locked);
        msg(locked ? 'Planning verrouillé' : 'Planning déverrouillé (reverrouillage automatique après 30 s)');
      });
      setLocked(true);
    }
    function isEditAct(act) { return act === 'copyWeek' || act === 'copyAll' || act === 'clear'; }

    function paintAt(target) {
      if (!target || target.dataset.i === undefined || !root.contains(target)) return;
      var i = parseInt(target.dataset.i, 10);
      if (plan[i] === dose) return;
      plan[i] = dose;
      cellStyle(target, dose);
      dirty = true;
    }
    elGrid.addEventListener('pointerdown', function (e) {
      if (e.target.dataset.i === undefined || locked) return;
      e.preventDefault();
      painting = true;
      armLock();
      paintAt(e.target);
    });
    elGrid.addEventListener('pointermove', function (e) {
      if (painting) paintAt(document.elementFromPoint(e.clientX, e.clientY));
    });
    elGrid.addEventListener('click', function (e) {
      if (locked && e.target.dataset.i !== undefined) lockedMsg();
    });
    window.addEventListener('pointerup', function () {
      if (!painting) return;
      painting = false;
      if (dirty) { renderGrid(); renderStatus(); saveSoon(); }
    });

    root.querySelector('.pd-actions').addEventListener('click', function (e) {
      var a = e.target.closest('[data-act]');
      if (!a) return;
      var act = a.dataset.act, src = plan.slice(day * SLOTS, (day + 1) * SLOTS), d, s;
      if (isEditAct(act)) {
        if (locked) { lockedMsg(); return; }
        armLock();
      }
      if (act === 'copyWeek' || act === 'copyAll') {
        var last = act === 'copyWeek' ? 5 : 7;
        for (d = 0; d < last; d++) for (s = 0; s < SLOTS; s++) plan[d * SLOTS + s] = src[s];
        msg('Planning du ' + DAY_NAME[day] + ' copié ' + (act === 'copyWeek' ? 'du lundi au vendredi' : 'sur toute la semaine'));
      } else if (act === 'clear') {
        for (s = 0; s < SLOTS; s++) plan[day * SLOTS + s] = 0;
        msg('Planning du ' + DAY_NAME[day] + ' vidé');
      }
      renderGrid(); renderStatus(); save();
    });

    function onUpdate(_options) {
      if (dirty || painting) return;
      load(_options.display_value !== undefined ? _options.display_value : _options.value);
      renderGrid(); renderStatus();
    }
    load('#state#');
    renderDays(); renderDoses(); renderGrid(); renderStatus(); refreshInfos();
    if (typeof jeedom.cmd.addUpdateFunction === 'function') {
      jeedom.cmd.addUpdateFunction('#id#', onUpdate);
    } else {
      jeedom.cmd.update['#id#'] = onUpdate;
    }
    watch(doneId, function (v) { done = parseInt(v, 10) || 0; });
    watch(lastDoseId, function (v) { lastDose = v; });
    watch(lastTimeId, function (v) { lastTime = v; });

    var tick = setInterval(function () {
      if (!document.body.contains(root)) { clearInterval(tick); return; }
      if (!painting) { renderDays(); renderGrid(); renderStatus(); }
      refreshInfos();
    }, 60000);
  })();
  </script>
</div>
